get:
  security: []
  tags:
    - Products
  summary: retrieve a list of products
  description: retrieve a list of products with optional pagination and filtering by categoryId
  operationId: listProducts
  parameters:
    - name: page
      in: query
      description: number of the page (starting from 1).
      required: false
      schema:
        type: integer
        minimum: 10
        default: 1
        example: 1
    - name: limit
      in: query
      description: amount of products per page .
      required: false
      schema:
        type: integer
        minimum: 10
        maximum: 10
        default: 10
        example: 10
    - name: categoryId
      in: query
      description: Filter products by categoryId (foreign key to category). If not provided, all products will be returned.
      required: false
      schema:
        type: string

  responses:
    "200":
      description: successfully retrieved list of products
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              data:
                type: array
                items:
                  $ref: ../../schemas/Product.yaml#/Product
              meta:
                type: object
                description: Pagination metadata (optional, if server implements).
                properties:
                  page:
                    type: integer
                    example: 1
                  limit:
                    type: integer
                    example: 10
                  total:
                    type: integer
                    description: all amount of products matching the filter.
                    example: 10
          examples:
            default:
              summary: response example for list of products
              value:
                data:
                  - id: "prd_01J0Y6QW3R9F8T2U7V5X4Z1ABC"
                    name: "Wireless Mouse"
                    description: "Mouse wireless ergonomic with 2.4GHz connectivity."
                    price: 8.4
                    imageUrl: "https://example.com/images/wireless-mouse.jpg"
                    stock: 25
                    categoryId: "cat_01HZXQ2WQ0Y5J3C3G2Z8D7H9JK"
                    createdAt: "2024-06-01T12:00:00Z"
                    updatedAt: "2024-06-15T15:30:00Z"
                meta:
                  page: 1
                  limit: 10
                  total: 10
    "400":
      description: Parameter query not valid.
      content:
        application/json:
          schema:
           $ref: ../../schemas/ErrorResponse.yaml#/ErrorResponse
          examples:
            validationError:
              summary: Parameter query not valid
              value:
                message: "page must be a non-negative integer"
                code: "VALIDATION_ERROR"

    "500":
      description: Internal server error.
      content:
        application/json:
          schema:
                  $ref: ../../schemas/ErrorResponse.yaml#/ErrorResponse       
          examples:
            internalError:
              summary: Internal server error
              value:
                message: "An error occurred on the server. Please try again later"
                code: "INTERNAL_SERVER_ERROR"