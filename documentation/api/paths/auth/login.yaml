post:
  tags:
    - Auth
  summary: Login user
  description: |
    Melakukan autentikasi user menggunakan email dan password.
    Jika berhasil, server akan mengembalikan JWT access token.

  operationId: loginUser

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#components/schemas/LoginRequest'

  responses:
    "200":
      description: Login berhasil
      content:
        application/json:
          schema:
            $ref: '#components/schemas/LoginResponse'

          examples:
          success:
            summary: Login berhasil
            value:
              message: "Login successful"
              code: "LOGIN_SUCCESS"

              data:
                user:
                  id: "usr_01HZXQ2WQ0Y5J3C3G2Z8D7H9JK"
                  email: "user@example.com"
                  name: "Zoro Tokyo"
                  createdAt: "2026-05-12T09:21:00.000Z"

                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

                expiresIn: 3600

    "401":
      description: Email atau password salah
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            invalidCredentials:
              summary: Login gagal
              value:
                message: "Email atau password salah"
                code: "UNAUTHORIZED"

    "400":
      description: Input tidak valid
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validasi gagal
              value:
                message: "Email dan password wajib diisi"
                code: "BAD_REQUEST"

    "500":
      description: Kesalahan server
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            serverError:
              summary: Error server
              value:
                message: "Terjadi kesalahan pada server"
                code: "INTERNAL_SERVER_ERROR"