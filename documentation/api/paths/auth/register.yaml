post:
  security: []
  tags:
    - Auth
  summary: 
    register a new user
  description: register a new user with email, password, and name. email must be unique and password will be hashed on the server. response can return JWT if auto-login is enabled.
  operationId: registerUser
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../schemas/User.yaml#/UserCreateRequest
        examples:
          default:
            value:
              email: user@example.com
              password: P@ssw0rd123
              name: Zoro Tokyo

  responses:
    "201":
      description: Registration successful
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - message
              - data
            properties:
              message:
                type: string
                example: Registration successful
              data:
                $ref: ../../schemas/Auth.yaml#/AuthSuccessData

    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: ../../schemas/ErrorResponse.yaml#/ErrorResponse
          examples:
            validationError:
              summary: Validation error
              value:
                message: "Format email tidak valid"
                code: "VALIDATION_ERROR"

    "409":
      description: Email already registered
      content:
        application/json:
          schema:
            $ref: ../../schemas/ErrorResponse.yaml#/ErrorResponse
          examples:
            emailAlreadyRegistered:
              summary: Email already registered
              value:
                message: "Email already registered. use a different email or login"
                code: "EMAIL_ALREADY_EXISTS"

    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: ../../schemas/ErrorResponse.yaml#/ErrorResponse
          examples:
            internalError:
              summary: Internal server error
              value:
                message: "An error occurred on the server. Please try again later"
                code: "INTERNAL_SERVER_ERROR"