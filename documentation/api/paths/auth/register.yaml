post:
  security: []
  tags:
    - Auth
  summary: Registrasi user baru
  description: |
    Membuat akun baru dengan email, password, dan nama.
    Email harus unik dan password akan di-hash di server.
    Response dapat mengembalikan JWT jika auto-login diaktifkan.

  operationId: register

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '#components/schemas/UserCreateRequest'
        examples:
          default:
            value:
              email: user@example.com
              password: P@ssw0rd123
              name: Zoro Tokyo

  responses:
    "201":
      description: Registrasi berhasil
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - message
              - data
            properties:
              message:
                type: string
                example: Registrasi berhasil
              data:
                $ref: '#components/schemas/AuthSuccessData'

    "400":
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            validationError:
              summary: Validasi body gagal
              value:
                message: "Format email tidak valid"
                code: "VALIDATION_ERROR"

    "409":
      description: Email sudah terdaftar
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            emailAlreadyRegistered:
              summary: Email sudah digunakan
              value:
                message: "Email sudah terdaftar. gunakan email lain atau login"
                code: "EMAIL_ALREADY_EXISTS"

    "500":
      description: Server error
      content:
        application/json:
          schema:
            $ref: '#components/schemas/ErrorResponse'
          examples:
            internalError:
              summary: Kesalahan server internal
              value:
                message: "Terjadi kesalahan pada server. Silakan coba lagi nanti"
                code: "INTERNAL_SERVER_ERROR"