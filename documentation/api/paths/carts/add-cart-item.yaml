post:
  tags:
    - Carts

  summary: Tambah produk ke keranjang

  description: >
    Menambahkan produk ke keranjang user yang sedang login.
    Jika produk sudah ada di keranjang, kuantitas akan ditambahkan.

  operationId: addCartItem


  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref:  '#/components/schemas/CartItemCreateRequest'                    
        examples:
        default:
          value:
            productId: "prd_01J0Y6QW3R9F8T2U7V5X4Z1ABC"
            quantity: 2

  responses:
    "201":
      description: Item berhasil ditambahkan ke keranjang.

      content:
        application/json:
          schema:
            type: object
            additionalProperties: false

            required:
              - message
              - data

            properties:
              message:
                type: string
                example: "Item ditambahkan ke keranjang."

              data:
                $ref: '#/components/schemas/CartItem'

          examples:
          success:
            summary: Contoh item berhasil ditambahkan
            value:
              message: "Item ditambahkan ke keranjang."
              data:
                id: "cit_01J1A2B3C4D5E6F7G8H9I0JKL"
                productId: "prd_01J0Y6QW3R9F8T2U7V5X4Z1ABC"
                quantity: 2

              
            

    "401":
      description: User belum login.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              summary: Token tidak ada atau tidak valid
              value:
                message: "Autentikasi diperlukan. Silakan login terlebih dahulu"
                code: "UNAUTHORIZED"

    "500":
      description: Kesalahan server internal.

      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            internalError:
              summary: Kesalahan server internal
              value:
                message: "Terjadi kesalahan pada server. Silakan coba lagi nanti"
                code: "INTERNAL_SERVER_ERROR"
