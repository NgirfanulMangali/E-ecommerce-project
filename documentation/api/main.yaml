openapi: 3.0.3

info:
  title: E-commerce API
  version: 1.0.0
  description: Dokumentasi API untuk proyek E-commerce.

servers:
  - url: http://localhost:5000

tags:
  - name: Products
    description: Daftar dan detail produk untuk katalog toko.
  - name: Carts
    description: Operasi keranjang belanja untuk user yang login.
  - name: Auth
    description: Autentikasi (register, login) dan token JWT.

security:
  - bearerAuth: []

paths:
  /auth/login:
    $ref: ./auth/login.yaml

  /auth/register:
    $ref: ./auth/register.yaml

  /products:
    $ref: ./paths/products.yaml

  /products/{productId}:
    $ref: ./paths/products.yaml

  /carts/me:
    $ref: ./paths/carts.yaml

  /carts/me/items:
    $ref: ./paths/carts.yaml

  /carts/me/items/{cartItemId}:
    $ref: ./paths/carts.yaml

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Token JWT (Authorization: Bearer <token>)"

  schemas:
    User:
      $ref: ./schemas/User.yaml

    UserCreateRequest:
      $ref: ./schemas/User.yaml

    Product:
      $ref: ./schemas/Product.yaml

    
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
        - code
      properties:
        message:
          type: string
        code:
          type: string

    SuccessResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
        data:
          type: object