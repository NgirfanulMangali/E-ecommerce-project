User:
  type: object
  additionalProperties: false
  description: User entity (`users` table).
  required:
    - id
    - email
    - name

  properties:
    id:
      type: string
      description: Primary key of the user.
      example: "usr_01HZXQ2WQ0Y5J3C3G2Z8D7H9JK"
    email:
      type: string
      format: email
      description: Email of the user (unique).
      example: "user@example.com"
    name:
      type: string
      description: Name of the user.
      example: "Zoro Tokyo"
  

UserCreateRequest:
  type: object
  additionalProperties: false
  description: Payload for creating a new user.
  required:
    - email
    - password
    - name
  properties:
    email:
      type: string
      format: email
      description: Email of the user (unique).
      example: "user@example.com"
    password:
      type: string
      format: password
      description: Password plaintext from client (will be hashed on the server).
      minLength: 8
      example: "P@ssw0rd123"
    name:
      type: string
      description: Name of the user.
      minLength: 1
      example: "Zoro Tokyo"
