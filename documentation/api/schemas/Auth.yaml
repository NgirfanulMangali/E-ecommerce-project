LoginRequest:
  type: object
  additionalProperties: false
  description: Payload for login (email + password).
  required:
    - email
    - password
  properties:
    email:
      type: string
      format: email
      description: Registered email.
      example: "user@example.com"
    password:
      type: string
      format: password
      description: Password plaintext from client.
      minLength: 1
      example: "P@ssw0rd123"

LoginResponse:
  type: object
  additionalProperties: false
  description: Response when login is successful
  required:
    - message
    - code
    - data
  properties:
    message:
      type: string
      description: Login successful message
      example: "Login successful"

    code:
      type: string
      description: Application status code
      example: "LOGIN_SUCCESS"

    data:
      $ref: ./AuthSuccessData.yaml#/AuthSuccessData


AuthSuccessData:
  type: object
  additionalProperties: false
  description: Data after successful authentication (login/register).
  required:
    - user
    - token
    - expiresIn
  properties:
    user:
      $ref: ./User.yaml#/User

    token:
      type: string
      description: JWT Bearer token for Authorization header.
      example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    expiresIn:
      type: integer
      description: Token expiration time in seconds.
      minimum: 1
      example: 3600

      
      
