ErrorResponse:
  type: object
  additionalProperties: false
  description: Format respons error standar.
  required:
    - message
    - code
  properties:
    message:
      type: string
      description: Error message for the client.
      example: "Query parameter is not valid."

    code:
      type: string
      description: Error code for programmatic handling.
      example: "INVALID_REQUEST"