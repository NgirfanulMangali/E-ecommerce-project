ErrorResponse:
  type: object
  additionalProperties: false
  description: Format respons error standar.
  required:
    - message
    - code
  properties:
    message:
      type: string
      description: Pesan error untuk client.
      example: "Query parameter tidak valid."

    code:
      type: string
      description: Kode error untuk penanganan programatik.
      example: "INVALID_REQUEST"