services:
  client:
    build: ./client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    build: ./server

    ports:
      - "5000:5000"

    volumes:
      - ./server:/app
      - /app/node_modules

    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/ecommerce

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ecommerce

    ports:
      - "5432:5432"