services:
  client:
    build: ./client

    ports:
      - "5173:5173"

    volumes:
      - ./client:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

  server:
    build: ./server

    ports:
      - "5000:5000"

    volumes:
      - ./server:/app
      - /app/node_modules

    

  